[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tf_pilot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev     = ["pytest>=8.0", "pytest-cov"]
tabpfn  = ["tabpfn==0.1.11"]  # v1 (Hollmann et al. 2022) — no API key, weights auto-download

[tool.setuptools.packages.find]
where = ["src"]
include = ["tf_pilot*", "bank_pilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
